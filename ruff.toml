target-version = "py315"
preview = true
extend-include = ["*.ipynb"]
line-length = 88
indent-width = 4
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".github/instructions",
    "__pycache__",
    "build",
    "dist",
    "erros_ruff",
    "typings",
    "subgenerator.py",

]

[lint]
select = ["ALL"]
# ignore = ["CPY", "S", "ARG", "PLC", "COM812", "D203", "D213", "FBT", "D102"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
ignore = ["D", "CPY"]

[lint.extend-per-file-ignores]
"**/{tests,docs,tools}/*" = ["S", "ANN"]
"./typings/**/*.pyi" = ["UP", "E", "ANN", "TD", "N", "FIX", "A"]


[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 72
